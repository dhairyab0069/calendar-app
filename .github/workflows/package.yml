name: Package

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/package.yml'
      - 'archive/java/**'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installers to (leave empty to only build artifacts)'
        required: false
        type: string

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build dmg
        run: packaging/build-installer.sh dmg "" dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset -y --no-progress
              $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
            }
            $wix.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$($wix.DirectoryName);$env:PATH"
          }
          candle.exe -? | Select-Object -First 1
      - name: Build exe
        shell: pwsh
        run: ./packaging/build-installer.ps1 -OutputDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    # Only for a pushed v* tag, or a manual run that names a tag.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        run: |
          ls -l dist
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.dmg dist/*.exe --clobber
